</defs><rect width="760" height="400" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">キースイッチの差し込み方（断面図）</text><path d="M 355 16 L 355 36" fill="none" stroke="#2f66c4" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="30" font-size="11.5" fill="#2f66c4" text-anchor="start">真上からまっすぐ、ゆっくり</text><!-- スイッチ本体（中心 x=355、ピン下端がプレート直上に来る位置） --><rect x="322.5" y="161.6" width="4" height="26.4" fill="#8a5416"/><rect x="373.3" y="161.6" width="4" height="26.4" fill="#8a5416"/><use href="#mx-switch-front" transform="translate(292.6,40) scale(1.3333)"/><text x="355" y="120" font-size="11.5" fill="#495057" text-anchor="middle">スイッチ</text><rect x="120" y="188" width="480" height="14" rx="3" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.2"/><text x="614" y="200" font-size="11" fill="#495057" text-anchor="start">トッププレート</text><rect x="120" y="226" width="480" height="18" rx="3" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.2"/><text x="614" y="240" font-size="11" fill="#495057" text-anchor="start">PCB</text><rect x="300" y="244" width="110" height="20" rx="4" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><text x="355" y="258" font-size="9.5" fill="#7a5c14" text-anchor="middle">ソケット</text><ellipse cx="355" cy="300" rx="34" ry="22" fill="#fde0ec" stroke="#c2447e" stroke-width="1.5"/><path d="M 355 292 L 355 272" fill="none" stroke="#c2447e" stroke-width="2.5" marker-end="url(#arr)"/><text x="400" y="305" font-size="11.5" fill="#c2447e" text-anchor="start">下から指でソケットを軽く支える</text><text x="400" y="322" font-size="10" fill="#868e96" text-anchor="start">（ソケットの剥離・破損防止）</text><text x="20" y="366" font-size="11" fill="#495057" text-anchor="start">位置を確かめながら無理な力を加えずに差し込み、装着後はキーがぐらつかないことを確認してください。</text></svg>
