<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- MX系スイッチ立面（正面図準拠）。ピンは含めず各図で描画。ローカル幅150・本体中心x=75、本体上端y=48・ボス下端y=128。switch-pins.svg / build-exploded.svg と同一定義。 --><g id="mxsw"><path d="M68 2 h14 v10 h10 v14 h-10 v10 h-14 v-10 h-10 v-14 h10 z" fill="#ced4da" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><path d="M30 50 L48 30 H102 L120 50 Z" fill="#eceff1" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><rect x="0" y="48" width="150" height="46" rx="8" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5"/><rect x="-5" y="64" width="7" height="14" rx="2" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="1.2"/><rect x="148" y="64" width="7" height="14" rx="2" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="1.2"/><line x1="10" y1="86" x2="140" y2="86" stroke="#b4bbc2" stroke-width="1"/><path d="M28 94 H122 L112 112 H38 Z" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><rect x="63" y="112" width="24" height="16" rx="3" fill="#adb5bd"/></g></defs><rect width="760" height="400" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">キースイッチの差し込み方（断面図）</text><path d="M 355 30 L 355 50" fill="none" stroke="#2f66c4" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="44" font-size="11.5" fill="#2f66c4" text-anchor="start">真上からまっすぐ、ゆっくり</text><!-- スイッチ本体（ステム上・ピン下） --><rect x="328" y="166" width="6" height="20" fill="#8a5416"/><rect x="376" y="166" width="6" height="20" fill="#8a5416"/><use href="#mxsw" x="280" y="54"/><text x="355" y="129" font-size="11.5" fill="#495057" text-anchor="middle">スイッチ</text><rect x="120" y="188" width="480" height="14" rx="3" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.2"/><text x="614" y="200" font-size="11" fill="#495057" text-anchor="start">トッププレート</text><rect x="120" y="226" width="480" height="18" rx="3" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.2"/><text x="614" y="240" font-size="11" fill="#495057" text-anchor="start">PCB</text><rect x="300" y="244" width="110" height="20" rx="4" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><text x="355" y="258" font-size="9.5" fill="#7a5c14" text-anchor="middle">ソケット</text><ellipse cx="355" cy="300" rx="34" ry="22" fill="#fde0ec" stroke="#c2447e" stroke-width="1.5"/><path d="M 355 292 L 355 272" fill="none" stroke="#c2447e" stroke-width="2.5" marker-end="url(#arr)"/><text x="400" y="305" font-size="11.5" fill="#c2447e" text-anchor="start">下から指でソケットを軽く支える</text><text x="400" y="322" font-size="10" fill="#868e96" text-anchor="start">（ソケットの剥離・破損防止）</text><text x="20" y="366" font-size="11" fill="#495057" text-anchor="start">位置を確かめながら無理な力を加えずに差し込み、装着後はキーがぐらつかないことを確認してください。</text></svg>
