<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- MX系スイッチ 正面図（データシート実寸比 1mm=8px）。幅: 上部ハウジング15.6mm=125 / 下部14mm=112 / 中央ポール4mm=32。縦: ステム3.6mm=28.8 / 上部ハウジング5.0mm=40 / 下部6.6mm=52.8 / 中央ポール3.3mm=26.4、総高18.5mm=148。本体中心x=62.5、プレート載置フランジ y=66。ピンは各図で描画。switch-pins.svg / build-exploded.svg と同一定義。 --><g id="mxsw"><path d="M 44.5 28.8 L 80.5 28.8 L 118 43 Q 125 46 125 52 L 125 68.8 L 118.5 68.8 L 118.5 116 L 112 121.6 L 13 121.6 L 6.5 116 L 6.5 68.8 L 0 68.8 L 0 52 Q 0 46 7 43 L 44.5 28.8 Z" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><line x1="6.5" y1="68.8" x2="118.5" y2="68.8" stroke="#b4bbc2" stroke-width="1"/><line x1="10" y1="52" x2="115" y2="52" stroke="#c7ced3" stroke-width="1"/><path d="M54.5 0 L70.5 0 L70.5 6 L77 6 L77 16 L70.5 16 L70.5 28.8 L54.5 28.8 L54.5 16 L48 16 L48 6 L54.5 6 Z" fill="#ced4da" stroke="#b4bbc2" stroke-width="1.4" stroke-linejoin="round"/><rect x="46.5" y="121.6" width="32" height="26.4" rx="4" fill="#d3d8dc" stroke="#b4bbc2" stroke-width="1.2"/></g></defs><rect width="760" height="400" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">キースイッチの差し込み方（断面図）</text><path d="M 355 18 L 355 38" fill="none" stroke="#2f66c4" stroke-width="3" marker-end="url(#arr)"/><text x="372" y="32" font-size="11.5" fill="#2f66c4" text-anchor="start">真上からまっすぐ、ゆっくり</text><!-- スイッチ本体（ステム上・ピン下、本体中心 x=355） --><rect x="328" y="158" width="6" height="26" fill="#8a5416"/><rect x="376" y="158" width="6" height="26" fill="#8a5416"/><use href="#mxsw" x="292.5" y="36"/><text x="355" y="120" font-size="11.5" fill="#495057" text-anchor="middle">スイッチ</text><rect x="120" y="188" width="480" height="14" rx="3" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.2"/><text x="614" y="200" font-size="11" fill="#495057" text-anchor="start">トッププレート</text><rect x="120" y="226" width="480" height="18" rx="3" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.2"/><text x="614" y="240" font-size="11" fill="#495057" text-anchor="start">PCB</text><rect x="300" y="244" width="110" height="20" rx="4" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><text x="355" y="258" font-size="9.5" fill="#7a5c14" text-anchor="middle">ソケット</text><ellipse cx="355" cy="300" rx="34" ry="22" fill="#fde0ec" stroke="#c2447e" stroke-width="1.5"/><path d="M 355 292 L 355 272" fill="none" stroke="#c2447e" stroke-width="2.5" marker-end="url(#arr)"/><text x="400" y="305" font-size="11.5" fill="#c2447e" text-anchor="start">下から指でソケットを軽く支える</text><text x="400" y="322" font-size="10" fill="#868e96" text-anchor="start">（ソケットの剥離・破損防止）</text><text x="20" y="366" font-size="11" fill="#495057" text-anchor="start">位置を確かめながら無理な力を加えずに差し込み、装着後はキーがぐらつかないことを確認してください。</text></svg>
