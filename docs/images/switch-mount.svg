<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker></defs><rect width="760" height="400" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">キースイッチの差し込み方（断面図）</text><rect x="280" y="70" width="150" height="60" rx="6" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5"/><text x="355" y="105" font-size="11.5" fill="#495057" text-anchor="middle">スイッチ</text><rect x="312" y="130" width="6" height="34" fill="#8a5416"/><rect x="390" y="130" width="6" height="34" fill="#8a5416"/><path d="M 355 44 L 355 64" fill="none" stroke="#2f66c4" stroke-width="3" marker-end="url(#arr)"/><text x="368" y="56" font-size="11.5" fill="#2f66c4" text-anchor="start">真上からまっすぐ、ゆっくり</text><rect x="120" y="188" width="480" height="14" rx="3" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.2"/><text x="614" y="200" font-size="11" fill="#495057" text-anchor="start">トッププレート</text><rect x="120" y="226" width="480" height="18" rx="3" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.2"/><text x="614" y="240" font-size="11" fill="#495057" text-anchor="start">PCB</text><rect x="300" y="244" width="110" height="20" rx="4" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><text x="355" y="258" font-size="9.5" fill="#7a5c14" text-anchor="middle">ソケット</text><ellipse cx="355" cy="300" rx="34" ry="22" fill="#fde0ec" stroke="#c2447e" stroke-width="1.5"/><path d="M 355 292 L 355 272" fill="none" stroke="#c2447e" stroke-width="2.5" marker-end="url(#arr)"/><text x="400" y="305" font-size="11.5" fill="#c2447e" text-anchor="start">下から指でソケットを軽く支える</text><text x="400" y="322" font-size="10" fill="#868e96" text-anchor="start">（ソケットの剥離・破損防止）</text><text x="20" y="366" font-size="11" fill="#495057" text-anchor="start">位置を確かめながら無理な力を加えずに差し込み、装着後はキーがぐらつかないことを確認してください。</text></svg>