<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- MX系スイッチ 正面図（データシート実寸比 1mm=8px）。幅: 上部15.6mm=125 / 下部14mm=112 / 中央ポール4mm=32。縦: ステム3.6mm=28.8 / 上部ハウジング5.0mm=40 / 下部6.6mm=52.8 / 中央ポール3.3mm=26.4、総高18.5mm=148。本体中心x=62.5、プレート載置フランジ y=66。switch-pins.svg / switch-mount.svg と同一定義。分解図では縮小配置。 --><g id="mxsw"><rect x="45.5" y="4" width="34" height="26" rx="4" fill="#ced4da" stroke="#b4bbc2" stroke-width="1.5"/><line x1="62.5" y1="7" x2="62.5" y2="28" stroke="#b4bbc2" stroke-width="1.2"/><line x1="51" y1="16" x2="74" y2="16" stroke="#b4bbc2" stroke-width="1.2"/><path d="M 7.5 28.8 L 117.5 28.8 Q 125 28.8 125 36.3 L 125 66 L 118.5 73 L 118.5 116 L 112 121.6 L 13 121.6 L 6.5 116 L 6.5 73 L 0 66 L 0 36.3 Q 0 28.8 7.5 28.8 Z" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><line x1="0" y1="66" x2="125" y2="66" stroke="#b4bbc2" stroke-width="1"/><rect x="46.5" y="120" width="32" height="28" rx="4" fill="#d3d8dc" stroke="#b4bbc2" stroke-width="1.2"/></g></defs><rect width="860" height="560" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">組み立ての構成順（側面から見た分解図）</text><path d="M 150 92 L 162 66 L 218 66 L 230 92 Z" fill="#ffffff" stroke="#b4bbc2" stroke-width="1.5"/><path d="M 290 92 L 302 66 L 358 66 L 370 92 Z" fill="#ffffff" stroke="#b4bbc2" stroke-width="1.5"/><path d="M 430 92 L 442 66 L 498 66 L 510 92 Z" fill="#ffffff" stroke="#b4bbc2" stroke-width="1.5"/><text x="588" y="82" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">キーキャップ</text><use href="#mxsw" transform="translate(162.5,96) scale(0.44)"/><use href="#mxsw" transform="translate(302.5,96) scale(0.44)"/><use href="#mxsw" transform="translate(442.5,96) scale(0.44)"/><text x="588" y="130" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">キースイッチ</text><text x="588" y="146" font-size="10.5" fill="#868e96" text-anchor="start">ピンをまっすぐ差し込む</text><rect x="90" y="180" width="480" height="16" rx="4" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.5"/><text x="588" y="192.0" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">トッププレート</text><text x="588" y="208.0" font-size="10.5" fill="#868e96" text-anchor="start">レイアウト変更時はここを交換</text><rect x="90" y="224" width="480" height="12" rx="4" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><text x="588" y="234.0" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">スイッチフォーム</text><text x="588" y="250.0" font-size="10.5" fill="#868e96" text-anchor="start">穴位置を合わせて PCB に重ねる</text><rect x="90" y="268" width="480" height="20" rx="4" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.5"/><text x="588" y="282.0" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">メイン基板（PCB）</text><text x="588" y="298.0" font-size="10.5" fill="#868e96" text-anchor="start">トッププレートとネジで固定</text><rect x="290" y="238" width="80" height="30" rx="4" fill="#fbd9d3" stroke="#c9524a" stroke-width="1.5"/><text x="330" y="257" font-size="10" fill="#8a2f28" text-anchor="middle">TPユニット</text><path d="M 370 253 C 430 253 420 300 420 318" fill="none" stroke="#c9524a" stroke-width="3" stroke-dasharray="5,3"/><text x="432" y="326" font-size="10" fill="#c9524a" text-anchor="start">フラットケーブル（もろいので注意）</text><rect x="174" y="288" width="32" height="10" rx="2" fill="#adb5bd"/><rect x="314" y="288" width="32" height="10" rx="2" fill="#adb5bd"/><rect x="454" y="288" width="32" height="10" rx="2" fill="#adb5bd"/><text x="90" y="326" font-size="10.5" fill="#868e96" text-anchor="start">裏面: ホットスワップソケット</text><path d="M 70 340 L 70 400 L 590 400 L 590 340 L 566 340 L 566 376 L 94 376 L 94 340 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/><text x="604" y="374" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">GH60互換ケース</text><text x="20" y="448" font-size="11.5" fill="#495057" text-anchor="start" font-weight="700">組み立ての流れ（分解は逆順）:</text><text x="20" y="470" font-size="11" fill="#495057" text-anchor="start">① フォーム・スタビ・トラックポイントユニットを整えて、PCB とトッププレートをネジで固定</text><text x="20" y="490" font-size="11" fill="#495057" text-anchor="start">② フラットケーブルを接続 → ③ ケースへ組み込み → ④ キースイッチ → ⑤ キーキャップ</text><text x="20" y="520" font-size="9.5" fill="#adb5bd" text-anchor="start">※ 形状は説明用に簡略化しています。ネジ位置・部品の外観は実物をご確認ください。</text></svg>