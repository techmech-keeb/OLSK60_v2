<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- スイッチ本体は tools/keydiagram/parts/mx-switch.svg のマスターから複製（手で編集せず sync_parts.py を使う）。部品は 6px=1mm、分解図では scale(0.5875) で縮小配置。 -->
<!-- parts:mx-switch-front:begin -->
<g id="mx-switch-front"><g transform="translate(-103.2,-99)"><path d="M115.2 120.6 L184.8 120.6 L192 126 L192 152.4 L196.8 152.4 L196.8 160.2 L192 160.2 L192 190.2 L108 190.2 L108 160.2 L103.2 160.2 L103.2 152.4 L108 152.4 L108 126 Z" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.1" stroke-linejoin="round"/><path d="M192 160.2 L195.5 172 L192 172 Z" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="0.9" stroke-linejoin="round"/><path d="M108 160.2 L104.5 172 L108 172 Z" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="0.9" stroke-linejoin="round"/><rect x="133.5" y="99" width="33" height="21.6" rx="2" fill="#ced4da" stroke="#b4bbc2" stroke-width="1.1"/><line x1="150" y1="101" x2="150" y2="118" stroke="#adb5bd" stroke-width="0.8"/><rect x="138" y="190.2" width="24" height="19.8" rx="3" fill="#d3d8dc" stroke="#b4bbc2" stroke-width="0.9"/><rect x="114.4" y="190.2" width="10.2" height="17" rx="2" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="0.9"/><rect x="175.4" y="190.2" width="10.2" height="17" rx="2" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="0.9"/></g></g>
<!-- parts:mx-switch-front:end -->
</defs><rect width="860" height="560" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">組み立ての構成順（側面から見た分解図）</text><!-- キーキャップ --><path d="M 150 92 L 162 66 L 218 66 L 230 92 Z" fill="#ffffff" stroke="#b4bbc2" stroke-width="1.5"/><path d="M 290 92 L 302 66 L 358 66 L 370 92 Z" fill="#ffffff" stroke="#b4bbc2" stroke-width="1.5"/><path d="M 430 92 L 442 66 L 498 66 L 510 92 Z" fill="#ffffff" stroke="#b4bbc2" stroke-width="1.5"/><text x="588" y="82" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">キーキャップ</text><!-- キースイッチ（3個） --><rect x="175.5" y="149.6" width="2" height="11.6" fill="#8a5416"/><rect x="197.9" y="149.6" width="2" height="11.6" fill="#8a5416"/><use href="#mx-switch-front" transform="translate(162.5,96) scale(0.5875)"/><rect x="315.5" y="149.6" width="2" height="11.6" fill="#8a5416"/><rect x="337.9" y="149.6" width="2" height="11.6" fill="#8a5416"/><use href="#mx-switch-front" transform="translate(302.5,96) scale(0.5875)"/><rect x="455.5" y="149.6" width="2" height="11.6" fill="#8a5416"/><rect x="477.9" y="149.6" width="2" height="11.6" fill="#8a5416"/><use href="#mx-switch-front" transform="translate(442.5,96) scale(0.5875)"/><text x="588" y="130" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">キースイッチ</text><text x="588" y="146" font-size="10.5" fill="#868e96" text-anchor="start">ピンをまっすぐ差し込む</text><!-- トラックポイントユニット: トッププレートの上、キースイッチの間に設置 --><rect x="253" y="112" width="14" height="12" rx="3" fill="#d64545" stroke="#a02828" stroke-width="1.2"/><rect x="232" y="124" width="56" height="37" rx="4" fill="#fbd9d3" stroke="#c9524a" stroke-width="1.5"/><text x="260" y="147" font-size="10" fill="#8a2f28" text-anchor="middle">TPユニット</text><!-- トッププレート（1.5mm厚）: FFC の通し穴で分割 --><rect x="90" y="180" width="160" height="6" rx="2" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.2"/><rect x="270" y="180" width="300" height="6" rx="2" fill="#dee2e6" stroke="#adb5bd" stroke-width="1.2"/><text x="588" y="188" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">トッププレート</text><text x="588" y="204" font-size="10.5" fill="#868e96" text-anchor="start">レイアウト変更時はここを交換</text><!-- FFC: トッププレートと PCB の穴を通り、PCB 裏面のコネクタへ --><path d="M 260 161 L 260 284" fill="none" stroke="#c9524a" stroke-width="3" stroke-dasharray="5,3"/><text x="278" y="212" font-size="10" fill="#c9524a" text-anchor="start">FFC（もろいので注意）</text><text x="278" y="226" font-size="9.5" fill="#868e96" text-anchor="start">トッププレートと PCB の穴を通す</text><!-- スイッチフォーム（3.5mm厚・別売） --><rect x="90" y="238" width="160" height="14" rx="2" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><rect x="270" y="238" width="300" height="14" rx="2" fill="#fff3cd" stroke="#cca75c" stroke-width="1.5"/><text x="588" y="246" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">スイッチフォーム</text><text x="588" y="262" font-size="10.5" fill="#c07a00" text-anchor="start">別売（キット非同梱・任意）／3.5mm厚</text><!-- メイン基板（1.6mm厚）: FFC の通し穴で分割 --><rect x="90" y="290" width="160" height="6.4" rx="2" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.2"/><rect x="270" y="290" width="300" height="6.4" rx="2" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.2"/><text x="588" y="297" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">メイン基板（PCB）</text><text x="588" y="313" font-size="10.5" fill="#868e96" text-anchor="start">トッププレートとネジで固定</text><!-- PCB 裏面: ホットスワップソケット（2.0mm厚）と FFC コネクタ --><rect x="174" y="296.4" width="32" height="8" rx="2" fill="#adb5bd"/><rect x="314" y="296.4" width="32" height="8" rx="2" fill="#adb5bd"/><rect x="454" y="296.4" width="32" height="8" rx="2" fill="#adb5bd"/><rect x="244" y="296.4" width="32" height="10" rx="2" fill="#fbd9d3" stroke="#c9524a" stroke-width="1.2"/><text x="90" y="322" font-size="10.5" fill="#868e96" text-anchor="start">裏面: ホットスワップソケット（2.0mm厚）</text><text x="330" y="322" font-size="10.5" fill="#c9524a" text-anchor="start">裏面: FFCコネクタ</text><!-- ケース --><path d="M 70 350 L 70 410 L 590 410 L 590 350 L 566 350 L 566 386 L 94 386 L 94 350 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/><text x="604" y="384" font-size="12.5" fill="#212529" text-anchor="start" font-weight="700">GH60互換ケース</text><text x="20" y="452" font-size="11.5" fill="#495057" text-anchor="start" font-weight="700">組み立ての流れ（分解は逆順）:</text><text x="20" y="474" font-size="11" fill="#495057" text-anchor="start">① スタビライザー（使う場合はフォームも）を取り付け、PCB とトッププレートをネジで固定</text><text x="20" y="494" font-size="11" fill="#495057" text-anchor="start">② FFC を PCB 裏面のコネクタへ接続 → ③ ケースへ組み込み → ④ キースイッチ → ⑤ キーキャップ</text><text x="20" y="518" font-size="9.5" fill="#adb5bd" text-anchor="start">※ トラックポイントユニットはトッププレートの上（キースイッチの間）に設置されます。スイッチフォームはキットに含まれません。</text><text x="20" y="536" font-size="9.5" fill="#adb5bd" text-anchor="start">※ スイッチの形状とプレート・フォーム・PCB・ソケットの厚みは実物比。層の間隔とケース形状は説明用に誇張・簡略化しています。</text></svg>
