<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker></defs><rect width="860" height="400" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">フラットケーブルの取り扱い（最重要注意点）</text><rect x="60" y="120" width="300" height="180" rx="8" fill="#d8f0dc" stroke="#2f8f45" stroke-width="1.5"/><text x="210" y="290" font-size="11.5" fill="#2f6b3a" text-anchor="middle">メイン基板（PCB）</text><rect x="120" y="70" width="120" height="44" rx="6" fill="#fbd9d3" stroke="#c9524a" stroke-width="1.5"/><text x="180" y="97" font-size="10.5" fill="#8a2f28" text-anchor="middle">トラックポイント</text><path d="M 240 92 C 300 92 300 150 300 170" fill="none" stroke="#c9524a" stroke-width="8" stroke-linecap="round" opacity="0.75"/><rect x="272" y="168" width="56" height="26" rx="4" fill="#fff3cd" stroke="#cca75c" stroke-width="2"/><text x="300" y="185" font-size="9.5" fill="#7a5c14" text-anchor="middle">コネクター</text><path d="M 300 168 L 300 140" fill="none" stroke="#b02a37" stroke-width="1.6" marker-end="url(#arr)"/><text x="310" y="150" font-size="10.5" fill="#b02a37" text-anchor="start">まっすぐ・ゆっくり抜き差し</text><text x="430" y="120" font-size="13" fill="#b02a37" text-anchor="start" font-weight="700">⚠ コネクターは非常にもろい部品です</text><text x="430" y="155" font-size="15" fill="#2f8f45" text-anchor="start" font-weight="700">○</text><text x="456" y="155" font-size="11.5" fill="#495057" text-anchor="start">ケーブルの根元ではなく端子部を持ち、まっすぐ抜き差しする</text><text x="430" y="185" font-size="15" fill="#2f8f45" text-anchor="start" font-weight="700">○</text><text x="456" y="185" font-size="11.5" fill="#495057" text-anchor="start">接続後は奥まで確実に入っているか確認する</text><text x="430" y="215" font-size="15" fill="#b02a37" text-anchor="start" font-weight="700">×</text><text x="456" y="215" font-size="11.5" fill="#495057" text-anchor="start">斜めに引っ張る・ねじる・強い力を加える</text><text x="430" y="245" font-size="15" fill="#b02a37" text-anchor="start" font-weight="700">×</text><text x="456" y="245" font-size="11.5" fill="#495057" text-anchor="start">ケーブルを鋭角に折り曲げる</text><text x="430" y="290" font-size="10" fill="#868e96" text-anchor="start">コネクターの向き・ロック機構の形は実物をご確認ください。</text><text x="20" y="360" font-size="9.5" fill="#adb5bd" text-anchor="start">※ 配置・形状は説明用に簡略化しています。</text></svg>