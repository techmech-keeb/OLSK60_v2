</defs><rect width="760" height="330" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">取り付け前のピン確認（スイッチを正面から見る）</text><!-- 良い例: ピンがまっすぐ（本体中心 x=155、ピンは実物どおり左右非対称） --><rect x="122.5" y="165.6" width="4" height="26.4" fill="#8a5416"/><rect x="173.3" y="165.6" width="4" height="26.4" fill="#8a5416"/><use href="#mx-switch-front" transform="translate(92.6,44) scale(1.3333)"/><text x="155" y="240" font-size="13" fill="#2f8f45" text-anchor="middle" font-weight="700">○ ピンがまっすぐ</text><!-- 悪い例: 片方のピンが曲がっている（本体中心 x=515） --><rect x="482.5" y="165.6" width="4" height="26.4" fill="#8a5416"/><path d="M 533.3 165.6 l 4 0 l 3 14 l 21 18 l -7 7 l -21 -19 z" fill="#b02a37"/><use href="#mx-switch-front" transform="translate(452.6,44) scale(1.3333)"/><text x="515" y="240" font-size="13" fill="#b02a37" text-anchor="middle" font-weight="700">× ピンが曲がっている</text><text x="515" y="262" font-size="10.5" fill="#495057" text-anchor="middle">→ 精密ピンセット等でまっすぐに直してから取り付け</text><text x="20" y="304" font-size="11" fill="#495057" text-anchor="start">曲がったまま差し込むとピンがソケットに入らず、キーが反応しない原因になります。</text></svg>
