<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- MX系スイッチ立面（正面図準拠）。ピンは含めず各図で描画。ローカル幅150・本体中心x=75、本体上端y=48・ボス下端y=128。switch-mount.svg / build-exploded.svg と同一定義。 --><g id="mxsw"><path d="M68 2 h14 v10 h10 v14 h-10 v10 h-14 v-10 h-10 v-14 h10 z" fill="#ced4da" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><path d="M30 50 L48 30 H102 L120 50 Z" fill="#eceff1" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><rect x="0" y="48" width="150" height="46" rx="8" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5"/><rect x="-5" y="64" width="7" height="14" rx="2" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="1.2"/><rect x="148" y="64" width="7" height="14" rx="2" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="1.2"/><line x1="10" y1="86" x2="140" y2="86" stroke="#b4bbc2" stroke-width="1"/><path d="M28 94 H122 L112 112 H38 Z" fill="#e3e7ea" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><rect x="63" y="112" width="24" height="16" rx="3" fill="#adb5bd"/></g></defs><rect width="760" height="330" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">取り付け前のピン確認（スイッチを裏から見る）</text><!-- 良い例: ピンがまっすぐ --><rect x="126" y="156" width="6" height="40" fill="#8a5416"/><rect x="184" y="156" width="6" height="40" fill="#8a5416"/><use href="#mxsw" x="80" y="44"/><text x="155" y="235" font-size="13" fill="#2f8f45" text-anchor="middle" font-weight="700">○ ピンがまっすぐ</text><!-- 悪い例: 片方のピンが曲がっている --><rect x="486" y="156" width="6" height="40" fill="#8a5416"/><path d="M 542 156 l 4 16 l 22 20 l -7 6 l -22 -20 l -3 -22 z" fill="#b02a37"/><use href="#mxsw" x="440" y="44"/><text x="515" y="235" font-size="13" fill="#b02a37" text-anchor="middle" font-weight="700">× ピンが曲がっている</text><text x="515" y="258" font-size="10.5" fill="#495057" text-anchor="middle">→ 精密ピンセット等でまっすぐに直してから取り付け</text><text x="20" y="300" font-size="11" fill="#495057" text-anchor="start">曲がったまま差し込むとピンがソケットに入らず、キーが反応しない原因になります。</text></svg>
