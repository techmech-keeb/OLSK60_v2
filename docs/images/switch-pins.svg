<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker></defs><rect width="760" height="330" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">取り付け前のピン確認（スイッチを裏から見る）</text><rect x="80" y="80" width="150" height="70" rx="6" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5"/><rect x="143" y="150" width="24" height="26" rx="3" fill="#adb5bd"/><rect x="114" y="150" width="6" height="42" fill="#8a5416"/><rect x="190" y="150" width="6" height="42" fill="#8a5416"/><text x="155" y="235" font-size="13" fill="#2f8f45" text-anchor="middle" font-weight="700">○ ピンがまっすぐ</text><rect x="440" y="80" width="150" height="70" rx="6" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5"/><rect x="503" y="150" width="24" height="26" rx="3" fill="#adb5bd"/><rect x="474" y="150" width="6" height="42" fill="#8a5416"/><path d="M 550 150 l 4 14 l 20 20 l -7 6 l -20 -20 l -3 -20 z" fill="#b02a37"/><text x="515" y="235" font-size="13" fill="#b02a37" text-anchor="middle" font-weight="700">× ピンが曲がっている</text><text x="515" y="258" font-size="10.5" fill="#495057" text-anchor="middle">→ 精密ピンセット等でまっすぐに直してから取り付け</text><text x="20" y="300" font-size="11" fill="#495057" text-anchor="start">曲がったまま差し込むとピンがソケットに入らず、キーが反応しない原因になります。</text></svg>