<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- スイッチ本体は tools/keydiagram/parts/mx-switch.svg のマスターから複製（手で編集せず sync_parts.py を使う）。部品は 6px=1mm、ここでは scale(1.3333) で 8px=1mm 相当に拡大。 -->
