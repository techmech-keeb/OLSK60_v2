<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#868e96"/></marker><!-- MX系スイッチ 正面図（データシート実寸比 1mm=8px）。幅: 上部ハウジング15.6mm=125 / 下部14mm=112 / 中央ポール4mm=32。縦: ステム3.6mm=28.8 / 上部ハウジング5.0mm=40 / 下部6.6mm=52.8 / 中央ポール3.3mm=26.4、総高18.5mm=148。本体中心x=62.5、プレート載置フランジ y=66。ピンは各図で描画。switch-mount.svg / build-exploded.svg と同一定義。 --><g id="mxsw"><rect x="45.5" y="4" width="34" height="26" rx="4" fill="#ced4da" stroke="#b4bbc2" stroke-width="1.5"/><line x1="62.5" y1="7" x2="62.5" y2="28" stroke="#b4bbc2" stroke-width="1.2"/><line x1="51" y1="16" x2="74" y2="16" stroke="#b4bbc2" stroke-width="1.2"/><path d="M 7.5 28.8 L 117.5 28.8 Q 125 28.8 125 36.3 L 125 66 L 118.5 73 L 118.5 116 L 112 121.6 L 13 121.6 L 6.5 116 L 6.5 73 L 0 66 L 0 36.3 Q 0 28.8 7.5 28.8 Z" fill="#e9ecef" stroke="#b4bbc2" stroke-width="1.5" stroke-linejoin="round"/><line x1="0" y1="66" x2="125" y2="66" stroke="#b4bbc2" stroke-width="1"/><rect x="46.5" y="120" width="32" height="28" rx="4" fill="#d3d8dc" stroke="#b4bbc2" stroke-width="1.2"/></g></defs><rect width="760" height="330" fill="#ffffff"/><text x="20" y="30" font-size="17" fill="#212529" text-anchor="start" font-weight="700">取り付け前のピン確認（スイッチを裏から見る）</text><!-- 良い例: ピンがまっすぐ（本体中心 x=155） --><rect x="128" y="166" width="6" height="36" fill="#8a5416"/><rect x="176" y="166" width="6" height="36" fill="#8a5416"/><use href="#mxsw" x="92.5" y="44"/><text x="155" y="240" font-size="13" fill="#2f8f45" text-anchor="middle" font-weight="700">○ ピンがまっすぐ</text><!-- 悪い例: 片方のピンが曲がっている（本体中心 x=515） --><rect x="488" y="166" width="6" height="36" fill="#8a5416"/><path d="M 536 166 l 3 15 l 22 19 l -8 6 l -22 -19 l -3 -21 z" fill="#b02a37"/><use href="#mxsw" x="452.5" y="44"/><text x="515" y="240" font-size="13" fill="#b02a37" text-anchor="middle" font-weight="700">× ピンが曲がっている</text><text x="515" y="262" font-size="10.5" fill="#495057" text-anchor="middle">→ 精密ピンセット等でまっすぐに直してから取り付け</text><text x="20" y="304" font-size="11" fill="#495057" text-anchor="start">曲がったまま差し込むとピンがソケットに入らず、キーが反応しない原因になります。</text></svg>
