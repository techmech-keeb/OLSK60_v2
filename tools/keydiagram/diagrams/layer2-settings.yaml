# レイヤー2（設定レイヤー）— 設定キー + 本体制御。テスト版 v3.0.0-rc.4 の配置。
# 出典: 製品ファームウェアの Layer 2 キーマップと設定キーの仕様。
#   1〜4 = 速度1 / 速度3 / 速度4 / 速度5、5 = 出荷時に戻す（押し続けて 2 秒）、
#   Q/W/E = 調整対象（速度・加速・減速）、T = スクロール曲線、A/S = 音、G = 押し込みクリック、
#   Z/X/C = オートレイヤー ON/OFF・遅延 150/800、V = 調整対象（オートレイヤーの時間）、
#   ↑/↓ = 値 ±、←/→ = 対象切替、「.」 = マウス層 TG(4)、9 = 設定消去、0 = BOOTSEL、
#   Backspace = 再起動、エンコーダ = オクターブ。
layout: olsk60
badge: {text: Layer 2, color: "#2f8f45"}
title: 設定レイヤー（設定キー押下中）
note: 設定キー（Delete の右）を押しながら各キーを押す
led: {text: "橙（調整中は対象色で明滅）", color: "#cc7a29"}
defaults: disabled
styles:
  spd: {fill: "#e7f0fb", stroke: "#2f66c4"}
  dly: {fill: "#e9f7ec", stroke: "#2f8f45"}
  snd: {fill: "#fff1e0", stroke: "#cc7a29"}
  adj: {fill: "#f3e8fb", stroke: "#7d5bb0"}
  fw:  {fill: "#e9ecef", stroke: "#b4bbc2"}
keys:
  "1":  {style: spd, label: 速度1, size: 10, sub: 青}
  "2":  {style: spd, label: 速度3, size: 10, sub: 黄・既定}
  "3":  {style: spd, label: 速度4, size: 10, sub: 紫}
  "4":  {style: spd, label: 速度5, size: 10, sub: 橙}
  "5":  {style: fw,  label: 出荷時に戻す, size: 6.5, sub: 押し続け2秒}
  "9":  {style: fw,  label: 設定消去, size: 8}
  "0":  {style: fw,  label: BOOTSEL, size: 8}
  bksp: {style: fw,  label: 再起動, size: 10}
  q:    {style: adj, label: 対象:速度, size: 7, sub: 青}
  w:    {style: adj, label: 対象:加速, size: 7, sub: シアン}
  e:    {style: adj, label: 対象:減速, size: 7, sub: 紫}
  dot:  {style: fw,  label: マウス層, size: 8, sub: TG(4)}
  t:    {style: spd, label: スクロール曲線, size: 6.5, sub: 緑/赤}
  a:    {style: snd, label: 音ON/OFF, size: 7.5, sub: 緑/赤}
  s:    {style: snd, label: 音モード, size: 8, sub: 青/橙}
  g:    {style: spd, label: 押込クリック, size: 7, sub: 緑/赤}
  z:    {style: dly, label: 自動層切替, size: 8, sub: 緑/赤}
  x:    {style: dly, label: 遅延S, size: 9.5, sub: 150ms}
  c:    {style: dly, label: 遅延L, size: 9.5, sub: 800ms}
  v:    {style: adj, label: 対象:遅延, size: 7, sub: 白}
  up:    {style: adj, label: 値＋, size: 9, sub: 対象色}
  down:  {style: adj, label: 値−, size: 9, sub: 対象色}
  left:  {style: adj, label: 対象←, size: 8}
  right: {style: adj, label: 対象→, size: 8}
encoder:
  lines:
    - "時計回り: オクターブ +"
    - "反時計回り: オクターブ −"
    - "ピアノモード中のみ有効"
  footnote: ※ 設定はキーボード内に自動保存され、電源 OFF でも保持されます
legend:
  - {x: 300, style: spd, text: TrackPoint の設定（速度・曲線・押し込み）}
  - {x: 560, style: dly, text: 自動マウス層（遅延・ON/OFF）}
  - {x: 300, row: 2, style: snd, text: サウンド設定（ON/OFF・モード）}
  - {x: 560, row: 2, style: adj, text: "調整（Q/W/E/V で対象を選び ↑↓ で増減）"}
  - {x: 800, style: fw, text: 本体制御}
