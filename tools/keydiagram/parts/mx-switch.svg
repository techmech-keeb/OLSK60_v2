<svg xmlns="http://www.w3.org/2000/svg" width="180" height="190" viewBox="0 0 180 190" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif">
<title>MX互換スイッチ 正面図（図の共通部品マスター）</title>
<desc>ビルドガイドの各図で使い回すスイッチ正面図の部品。形状は docs/images/cherry-mx-switch-views.svg の正面図から取り出し、原点を左上（0,0）に正規化したもの。</desc>

<!--
  部品: mx-switch-front
  形状の出典 : docs/images/cherry-mx-switch-views.svg の「正面図」
  寸法の出典 : docs/reference/cherry-mx-switch-spec.md
  縮尺       : 6px = 1mm（元図と同じ）
  外形       : 幅 93.6px = 15.6mm / 高さ 111px = 18.5mm（ステム頂点〜ボス下端）
  原点       : 部品の左上角。<use> の x,y はここに合う
  内訳(部品内座標):
    ステム頂点      y = 0        （3.6mm 突出）
    ハウジング上面  y = 21.6
    フランジ下面    y = 61.2     （プレート上面が載る高さ）
    ハウジング下面  y = 91.2
    ボス／ピン下端  y = 111
  ピンは部品に含めない（図ごとに描く。曲がったピンなどの描き分けのため）。
    ピン位置(部品内): x = 22.4 と 60.5、幅 3、y = 91.2 から下へ 19.8
    ピン中心(部品内): x = 23.9 と 62.0 ※MXのピンは左右非対称
  配色はビルドガイド他図のパレットに合わせてある。
  この g 要素は tools/keydiagram/sync_parts.py で各図へ複製される。
  形を直すときはこのファイルを直し、sync_parts.py を実行すること。
-->
<defs>
<!-- parts:mx-switch-front:begin -->
